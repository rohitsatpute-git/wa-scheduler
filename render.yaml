# Render Blueprint: app + Postgres.
# Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: wa-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Must be always-on: holds the WhatsApp sockets and runs the scheduler.
    # The free plan sleeps when idle, which would miss scheduled sends.
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wa-scheduler-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 64 hex chars. Render can't generate hex, so you enter it when creating the Blueprint.
      # Keep a copy: changing it invalidates every linked WhatsApp session.
      - key: SESSION_ENC_KEY
        sync: false
      - key: MAX_RECIPIENTS
        value: "50"

databases:
  - name: wa-scheduler-db
    plan: basic-256mb
    databaseName: wa_scheduler
    user: wa
    ipAllowList: []   # internal access only
