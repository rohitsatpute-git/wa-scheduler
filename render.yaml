# Render Blueprint: app + Postgres.
# Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: wa-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Must be always-on: holds the WhatsApp sockets and runs the scheduler.
    # The free plan sleeps when idle, which would miss scheduled sends.
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wa-scheduler-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 64 hex chars. Render can't generate hex, so you enter it when creating the Blueprint.
      # Keep a copy: changing it invalidates every linked WhatsApp session.
      - key: SESSION_ENC_KEY
        sync: false
      - key: MAX_RECIPIENTS
        value: "50"
      # Shown on /privacy (the Play Store privacy policy URL). Use an inbox you check.
      - key: CONTACT_EMAIL
        sync: false
      # The Android app's WebView origin, allowed to call the API with its bearer token.
      - key: APP_ORIGINS
        value: https://localhost,capacitor://localhost
      # Optional: enables AI auto-reply. Set one key; leave all empty to keep the feature off.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: wa-scheduler-db
    plan: basic-256mb
    databaseName: wa_scheduler
    user: wa
    ipAllowList: []   # internal access only
